name: StationToStation
options:
  bundleIdPrefix: io.github.magnusencoded
  deploymentTarget:
    iOS: "16.0"

# Bundled credentials, injected the same way as the Android build: a default
# baked in here, overridable from CI secrets via `xcodebuild SPOTIFY_CLIENT_ID=…`.
# Blank counts as absent (see Config.swift), so an unset secret can't mask the
# built-in default. PKCE needs no client secret, so shipping the client ID is safe.
settings:
  base:
    # Same registration as the Android build — this Spotify app has
    # station-to-station://callback on its redirect list. A different id here
    # (bab4fc…) shipped an app without that redirect, so on-device login failed
    # with "redirect_uri: not matching configuration".
    SPOTIFY_CLIENT_ID: 4d0ca5e417a54b599b07bfac99671644
    SETLISTFM_API_KEY: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StationToStation:
    type: application
    platform: iOS
    sources:
      - StationToStation
      # The shared weave fixtures, bundled as a folder reference (structure
      # preserved, so the two timelines.json in different cases don't collide).
      # This is how CI seeds a real Spine: `station-to-station://fixture/<name>`
      # loads one, since a pinch can't be scripted and there is no live import in
      # CI. Six tiny JSON docs; harmless to ship in a prototype.
      - path: ../fixtures/weave
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.magnusencoded.stationtostation
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Spine with two Nodes on it, same mark as the Android launcher icon.
        # A single 1024 asset; iOS renders every other size from it and applies
        # its own corner mask, so the mark is drawn full-bleed with no rounding
        # of our own.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Simulator builds need no signing (mirrors Android's unsigned debug APK).
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: StationToStation/Info.plist
      properties:
        CFBundleDisplayName: Station to Station
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The Exchange: BLE is how an iPhone and a Pixel find each other, the
        # camera is the QR fallback when the radio sulks. Both are foreground-only
        # and only ever on the Exchange screen.
        NSBluetoothAlwaysUsageDescription:
          Station to Station uses Bluetooth to find people standing next to you and
          swap timeline cards directly, with no server in between.
        NSCameraUsageDescription:
          Station to Station uses the camera to scan a friend's card when Bluetooth
          can't reach them.
        # Attach (#99): the picker runs out of process and needs no permission to
        # show the library, but reading the picked asset's bytes — to keep the
        # thumbnail that outlives it (#98) — does. "Selected Photos" is enough.
        NSPhotoLibraryUsageDescription:
          Station to Station keeps a small copy of the photos you attach to a gig,
          so the grid of that night still renders years later.
        # Baked-in credentials, surfaced to Config via Info.plist.
        SpotifyClientId: $(SPOTIFY_CLIENT_ID)
        SetlistFmApiKey: $(SETLISTFM_API_KEY)
        # One scheme now: station-to-station carries the friend card
        # (station-to-station://friend?u=…&sid=…&name=…) and reaching a Resolution
        # without a gesture (station-to-station://<line>/<gig>) — the same scheme
        # Android answers. Pinch cannot be scripted on either platform, so this is
        # how CI (and a human with a URL bar) gets to the spine at all; the first
        # segment is whose line — "me" for my own. (Spotify's OAuth callback is
        # handled by ASWebAuthenticationSession, not through a URL scheme here.)
        # The old setlist2spotify scheme is kept registered belt-and-suspenders so
        # friend cards shared before the rename still open the app.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.magnusencoded.stationtostation
            CFBundleURLSchemes: [station-to-station]
          - CFBundleURLName: io.github.magnusencoded.setlist2spotify
            CFBundleURLSchemes: [setlist2spotify]

  StationToStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StationToStationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: StationToStation

schemes:
  StationToStation:
    build:
      targets:
        StationToStation: all
    test:
      targets:
        - StationToStationTests
