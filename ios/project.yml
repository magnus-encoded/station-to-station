name: StationToStation
options:
  bundleIdPrefix: io.github.magnusencoded
  deploymentTarget:
    iOS: "16.0"

# Bundled credentials, injected the same way as the Android build: a default
# baked in here, overridable from CI secrets via `xcodebuild SPOTIFY_CLIENT_ID=…`.
# Blank counts as absent (see Config.swift), so an unset secret can't mask the
# built-in default. PKCE needs no client secret, so shipping the client ID is safe.
settings:
  base:
    # Same registration as the Android build — this Spotify app has
    # station-to-station://callback on its redirect list. A different id here
    # (bab4fc…) shipped an app without that redirect, so on-device login failed
    # with "redirect_uri: not matching configuration".
    SPOTIFY_CLIENT_ID: 4d0ca5e417a54b599b07bfac99671644
    SETLISTFM_API_KEY: ""
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StationToStation:
    type: application
    platform: iOS
    sources:
      - StationToStation
      # The shared weave fixtures, bundled as a folder reference (structure
      # preserved, so the two timelines.json in different cases don't collide).
      # This is how CI seeds a real Spine: `station-to-station://fixture/<name>`
      # loads one, since a pinch can't be scripted and there is no live import in
      # CI. Six tiny JSON docs; harmless to ship in a prototype.
      - path: ../fixtures/weave
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.magnusencoded.stationtostation
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Spine with two Nodes on it, same mark as the Android launcher icon.
        # A single 1024 asset; iOS renders every other size from it and applies
        # its own corner mask, so the mark is drawn full-bleed with no rounding
        # of our own.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Simulator builds need no signing (mirrors Android's unsigned debug APK).
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      # Embeds the Share Extension in the app bundle. An extension is not installable
      # on its own — it ships inside its host or not at all.
      - target: TicketShare
    # The App Group the Share Extension deposits parsed Tickets into, and the only
    # thing the two processes share (ADR-0020). Declared on both targets; the ids
    # must be identical or the container resolves to nil on one side and the handover
    # silently does nothing.
    entitlements:
      path: StationToStation.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.magnusencoded.stationtostation
    info:
      path: StationToStation/Info.plist
      properties:
        CFBundleDisplayName: Station to Station
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The Exchange: BLE is how an iPhone and a Pixel find each other, the
        # camera is the QR fallback when the radio sulks. Both are foreground-only
        # and only ever on the Exchange screen.
        NSBluetoothAlwaysUsageDescription:
          Station to Station uses Bluetooth to find people standing next to you and
          swap timeline cards directly, with no server in between.
        NSCameraUsageDescription:
          Station to Station uses the camera to scan a friend's card when Bluetooth
          can't reach them.
        # Reconcile over the same WiFi (#265): both keys are required before iOS will
        # let NWBrowser or NWListener touch the local network at all. The service type
        # is Android's constant verbatim — the two have to match or the phones never
        # see each other. Foreground-only and Exchange-screen-only, like the radios above,
        # and only started once there is a Contact worth searching for.
        NSLocalNetworkUsageDescription:
          Station to Station finds contacts you've already swapped cards with on the same
          WiFi, so their photos from a night you shared arrive without waiting on the cloud.
        NSBonjourServices:
          - _stationtostation._tcp
        # Attach (#99): the picker runs out of process and needs no permission to
        # show the library, but reading the picked asset's bytes — to keep the
        # thumbnail that outlives it (#98) — does. "Selected Photos" is enough.
        NSPhotoLibraryUsageDescription:
          Station to Station keeps a small copy of the photos you attach to a gig,
          so the grid of that night still renders years later.
        # Check-in (#174): one foreground fix, compared against a planned gig's
        # venue, to offer "are you here?" on the night. No background location.
        NSLocationWhenInUseUsageDescription:
          Station to Station checks your location once, only while you're using
          the app, to offer a check-in when you're at a gig you're going to.
        # The future edge (#175): calendar access is asked for only when you tap "Add
        # to calendar" on a gig you're going to, never at launch. Both keys are listed
        # because the deployment target is iOS 16 (see below), which predates iOS 17's
        # split into full/write-only access — the pre-17 key is what the old API reads,
        # the new one is what 17+ reads, and only one applies on any given device.
        NSCalendarsUsageDescription:
          Station to Station adds a gig you're going to as a calendar event, at your
          request.
        NSCalendarsFullAccessUsageDescription:
          Station to Station adds a gig you're going to as a calendar event, at your
          request.
        # Baked-in credentials, surfaced to Config via Info.plist.
        SpotifyClientId: $(SPOTIFY_CLIENT_ID)
        SetlistFmApiKey: $(SETLISTFM_API_KEY)
        # One scheme now: station-to-station carries the friend card
        # (station-to-station://friend?u=…&sid=…&name=…) and reaching a Resolution
        # without a gesture (station-to-station://<line>/<gig>) — the same scheme
        # Android answers. Pinch cannot be scripted on either platform, so this is
        # how CI (and a human with a URL bar) gets to the spine at all; the first
        # segment is whose line — "me" for my own. (Spotify's OAuth callback is
        # handled by ASWebAuthenticationSession, not through a URL scheme here.)
        # The old setlist2spotify scheme is kept registered belt-and-suspenders so
        # friend cards shared before the rename still open the app.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.magnusencoded.stationtostation
            CFBundleURLSchemes: [station-to-station]
          - CFBundleURLName: io.github.magnusencoded.setlist2spotify
            CFBundleURLSchemes: [setlist2spotify]

  # Sharing a PDF ticket into the app (#412). The extension rasterizes the PDF with
  # PDFKit, extracts with Vision, parses with the same pure function the app's own
  # tests assert, and leaves the result in the App Group inbox. It never opens
  # `timelines.json` — see ADR-0020.
  TicketShare:
    type: app-extension
    platform: iOS
    sources:
      - TicketShare
      # The shared half, compiled into both targets rather than pulled out into a
      # framework: two small files with no dependencies do not earn a module, and a
      # framework would be the first in this project. Everything in this folder is
      # shared by construction — routing, which needs FmSetlist, lives outside it.
      - path: StationToStation/Data/Ticket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.magnusencoded.stationtostation.ticketshare
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: TicketShare/Info.plist
      properties:
        CFBundleDisplayName: Station to Station
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # PDFs and nothing else. `SupportsFileWithMaxCount` alone would put this
            # app in the share sheet for every file on the phone, which is how an
            # extension earns itself a permanent place in the "more" list.
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item,
              SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              ).@count == 1).@count == 1
    entitlements:
      path: TicketShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.magnusencoded.stationtostation

  StationToStationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StationToStationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: StationToStation

schemes:
  StationToStation:
    build:
      targets:
        StationToStation: all
    test:
      targets:
        - StationToStationTests
