name: SetlistToSpotify
options:
  bundleIdPrefix: io.github.magnusencoded
  deploymentTarget:
    iOS: "16.0"

# Bundled credentials, injected the same way as the Android build: a default
# baked in here, overridable from CI secrets via `xcodebuild SPOTIFY_CLIENT_ID=…`.
# Blank counts as absent (see Config.swift), so an unset secret can't mask the
# built-in default. PKCE needs no client secret, so shipping the client ID is safe.
settings:
  base:
    SPOTIFY_CLIENT_ID: bab4fc1ae9e94f3b936fbda65be76bc7
    SETLISTFM_API_KEY: ""
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SetlistToSpotify:
    type: application
    platform: iOS
    sources:
      - SetlistToSpotify
      # The shared weave fixtures, bundled as a folder reference (structure
      # preserved, so the two timelines.json in different cases don't collide).
      # This is how CI seeds a real Spine: `station-to-station://fixture/<name>`
      # loads one, since a pinch can't be scripted and there is no live import in
      # CI. Six tiny JSON docs; harmless to ship in a prototype.
      - path: ../fixtures/weave
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.magnusencoded.setlist2spotify
        TARGETED_DEVICE_FAMILY: "1,2"
        # Simulator builds need no signing (mirrors Android's unsigned debug APK).
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: SetlistToSpotify/Info.plist
      properties:
        CFBundleDisplayName: Station to Station
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Baked-in credentials, surfaced to Config via Info.plist.
        SpotifyClientId: $(SPOTIFY_CLIENT_ID)
        SetlistFmApiKey: $(SETLISTFM_API_KEY)
        # One scheme now: station-to-station carries the friend card
        # (station-to-station://friend?u=…&sid=…&name=…) and reaching a Resolution
        # without a gesture (station-to-station://<line>/<gig>) — the same scheme
        # Android answers. Pinch cannot be scripted on either platform, so this is
        # how CI (and a human with a URL bar) gets to the spine at all; the first
        # segment is whose line — "me" for my own. (Spotify's OAuth callback is
        # handled by ASWebAuthenticationSession, not through a URL scheme here.)
        # The old setlist2spotify scheme is kept registered belt-and-suspenders so
        # friend cards shared before the rename still open the app.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.magnusencoded.stationtostation
            CFBundleURLSchemes: [station-to-station]
          - CFBundleURLName: io.github.magnusencoded.setlist2spotify
            CFBundleURLSchemes: [setlist2spotify]

  SetlistToSpotifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SetlistToSpotifyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: SetlistToSpotify

schemes:
  SetlistToSpotify:
    build:
      targets:
        SetlistToSpotify: all
    test:
      targets:
        - SetlistToSpotifyTests
