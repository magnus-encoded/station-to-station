name: Android CI

on:
  # No branch filter on push: the work happens on branches, and there is no local
  # JDK 17 to run the tests against, so a branch that can't reach CI can't be checked.
  push:
    paths: [ "android/**", "fixtures/**", ".github/workflows/android.yml" ]
  pull_request:
    branches: [ "main", "features-parity", "features-tour" ]
    paths: [ "android/**", "fixtures/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  # One commit on a branch with an open PR fires this workflow twice: once for the
  # push, once for the pull_request. When both runs build the same tree, the later
  # one skips its build if the other is still running or already went green. The
  # PR run builds the merge with main, so a branch behind main still builds twice.
  pre_job:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        # Pinned by SHA: this is third-party code handed a token. v5.3.2.
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: 'true'
          do_not_skip: '["workflow_dispatch"]'

  build:
    needs: pre_job
    # Never skipped on main, matching ios.yml: a skipped run is green with no
    # artifacts, and main's newest green run should always carry an APK.
    if: needs.pre_job.outputs.should_skip != 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Tour character
        run: |
          python3 fixtures/tour/check_character.py
          python3 fixtures/tour/test_character.py

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Optional repo secrets; when set, the APK ships with one-tap
          # "Log in with Spotify" and a bundled setlist.fm API key.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      # retention-days because this runs on every push to every branch and the APK
      # is ~21MB: at the 90-day default it was 631 copies and 11GB, against a 0.5GB
      # plan. A debug APK is worth having for the branch you are currently testing
      # and worth nothing a week later — the commit is still there to rebuild from.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          # A glob rather than a filename: `splits.abi` in build.gradle.kts puts the
          # ABI in the name (app-arm64-v8a-debug.apk), and a glob survives that list
          # changing without another workflow edit.
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      # Compile the Keystore device test here; execution requires an attached device.
      - name: Upload device test APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-androidTest
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

      # The same code non-debuggable. Costs about a minute a run, and buys the only
      # artifact a performance number may be taken from — see docs/measuring-on-device.md.
      # Built every time rather than on demand: an artifact that is usually absent is one
      # nobody reaches for, and "why is there no APK on this run" is its own detour.
      - name: Build measure APK
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./gradlew --no-daemon assembleMeasure

      - name: Upload measure APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-measure
          path: android/app/build/outputs/apk/measure/*.apk
          retention-days: 7
