name: Android CI

on:
  # No branch filter on push: the work happens on branches, and there is no local
  # JDK 17 to run the tests against, so a branch that can't reach CI can't be checked.
  push:
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Optional repo secrets; when set, the APK ships with one-tap
          # "Log in with Spotify" and a bundled setlist.fm API key.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      # retention-days because this runs on every push to every branch and the APK
      # is ~21MB: at the 90-day default it was 631 copies and 11GB, against a 0.5GB
      # plan. A debug APK is worth having for the branch you are currently testing
      # and worth nothing a week later — the commit is still there to rebuild from.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # The same code non-debuggable. Costs about a minute a run, and buys the only
      # artifact a performance number may be taken from — see docs/measuring-on-device.md.
      # Built every time rather than on demand: an artifact that is usually absent is one
      # nobody reaches for, and "why is there no APK on this run" is its own detour.
      - name: Build measure APK
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./gradlew --no-daemon assembleMeasure

      - name: Upload measure APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-measure
          path: android/app/build/outputs/apk/measure/app-measure.apk
          retention-days: 7
