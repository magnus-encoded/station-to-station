name: Android CI

on:
  # No branch filter on push: the work happens on branches, and there is no local
  # JDK 17 to run the tests against, so a branch that can't reach CI can't be checked.
  push:
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: android
        env:
          # Optional repo secrets; when set, the APK ships with one-tap
          # "Log in with Spotify" and a bundled setlist.fm API key.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
