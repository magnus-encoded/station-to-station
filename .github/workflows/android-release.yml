name: Android Release Bundle

# Only tagged commits produce an uploadable artifact: a bundle exists because
# someone decided to publish, not because a branch happened to be green.
#
# Deliberately NOT folded into android.yml. That workflow's push trigger carries
# a `paths:` filter, and GitHub applies path filters to tag pushes as well — a
# release tag whose diff never touched android/** would be silently skipped, and
# the failure mode is a tag that produces no bundle and no red run to notice.
on:
  push:
    tags: [ "v*" ]
  # Publishing the same tag twice, or shipping a build to a different track
  # without cutting a new tag for it. The track input is how production happens:
  # run this by hand against the tag once the build has proven itself elsewhere.
  workflow_dispatch:
    inputs:
      track:
        description: Play track to publish to
        default: alpha
        type: choice
        options: [ internal, alpha, beta, production ]

# One place to change when the app graduates. A tag push publishes here; the
# manual trigger above overrides it per-run without touching this file.
env:
  DEFAULT_PUBLISH_TRACK: alpha

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Creating the release and attaching the .apk needs write; the default for
    # GITHUB_TOKEN is read-only on repos that have tightened it, and the failure
    # is a 403 after the build has already been paid for.
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          # versionCode is the commit count, and the default shallow clone cannot
          # count. Without this the build silently falls back to gradle.properties
          # and ships a stale code that Play refuses.
          fetch-depth: 0

      # Monotonic along a line of history, recoverable from any checkout, and it
      # never resets. It only climbs if you tag from main: a tag on a branch that
      # is behind can produce a lower count than the last upload, which Play then
      # refuses. Left unguarded because the rejection is immediate and harmless.
      - name: Derive versionCode from the commit count
        run: echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Green before published. The tag says "ship this"; the tests say whether
      # it can be shipped, and a red tag must not leave a bundle behind.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # keystore.properties is gitignored and absent here, so the signing config
      # in app/build.gradle.kts falls through to these env vars. UPLOAD_STORE_FILE
      # is resolved against the Gradle root, which is android/.
      # `tr -d` because the secret is set by a human at a shell, and `base64 -w0`
      # under Git Bash on Windows emits CRLF. GNU base64 rejects the CR outright
      # and writes a truncated file, which then fails as "wrong password" three
      # steps later. Stripping both line endings costs nothing and makes the
      # secret portable across whatever machine sets it next.
      - name: Restore the upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > android/upload-keystore.jks
          echo "decoded $(stat -c%s android/upload-keystore.jks) bytes"

      # Without the key, build.gradle.kts drops the signing config and produces an
      # *unsigned* bundle rather than failing — green here, rejected at the Play
      # Console. Catch it before spending a build on it.
      #
      # keytool's output is kept: piping it to /dev/null once turned a one-line
      # "keystore password was incorrect" into a bare exit 1 with nothing to read.
      - name: Check the keystore arrived
        run: |
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "${{ secrets.UPLOAD_STORE_PASSWORD }}" \
            -alias "${{ secrets.UPLOAD_KEY_ALIAS }}"

      - name: Build release bundle
        working-directory: android
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          UPLOAD_STORE_FILE: upload-keystore.jks
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      # An unsigned artifact is accepted by Gradle and refused by Play, hours
      # later and with a worse error. This is the cheapest place to learn it.
      - name: Verify both artifacts are signed
        run: |
          # Not -strict. An upload key is self-signed by definition and -strict
          # ranks a self-signed chain as an error, so it failed on a bundle that
          # was correctly signed. Plain -verify still catches what matters: an
          # unsigned jar reports "jar is unsigned" and exits non-zero.
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

          # jarsigner is the wrong tool for the APK. minSdk is 26, so AGP signs
          # with APK Signature Scheme v2/v3 and can omit the v1 JAR signature
          # altogether — jarsigner would call a properly signed APK unsigned.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      # The .aab goes to Play and nowhere else — it is not installable, so putting
      # it on the Releases page would only offer people a file they cannot open.
      # The .aab is a means to a Play upload, and the Publish step below has already
      # made it by the time this expires. The installable half of a release — the
      # .apk — lives on the Releases page, which is not Actions storage and is not
      # pruned, so an old tag stays reachable as something you can actually install.
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # The store is one channel, not the only one. The .apk is what someone
      # downloads and installs directly, so it is the asset on the Releases page.
      #
      # It is signed with the upload key. Play re-signs its own copy with the app
      # signing key it holds, so the two are different signatures and Android will
      # not update one with the other — a sideloader has to uninstall before
      # switching channels. That is a property of Play App Signing, not something
      # this workflow can reconcile; it belongs in the release notes.
      #
      # Tag pushes only. A manual run can be dispatched against a branch, and
      # github.ref_name would then name the release after the branch — creating
      # a "main" release with an APK attached to it.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          cp "$apk" "StationToStation-${{ github.ref_name }}.apk"
          # --clobber so a re-run replaces the asset rather than failing, and
          # `create || true` so the iOS side can own the release if it lands first.
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            "StationToStation-${{ github.ref_name }}.apk" --clobber

      # The iOS half of the same release. Pulled from the newest green iOS run
      # rather than built here — this runner has no Xcode, and ios.yml has
      # already produced exactly this file. Without it a tag would publish an
      # APK alone: a release event raised by GITHUB_TOKEN cannot start ios.yml,
      # so nothing on the iOS side notices a tag was cut.
      #
      # Unsigned Debug for arm64, to be re-signed by whoever installs it; the
      # filename says so. Never fails the release: the Android bundle is already
      # published by this point, and an absent or stale iOS build is a state to
      # report, not a reason to redo everything above.
      - name: Attach the newest iOS build
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow=ios.yml --branch main --status success \
                  --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "no green iOS run on main — release goes out without an IPA"
            exit 0
          fi
          gh run download "$run" -n StationToStation-ipa -D ipa
          mv ipa/StationToStation.ipa StationToStation-debug.ipa
          gh release upload "${{ github.ref_name }}" StationToStation-debug.ipa --clobber

      # Last, because everything above is recoverable and this is not: once a
      # versionCode is on a track it cannot be re-uploaded, only superseded.
      #
      # Skips rather than fails when the credential is absent, so the workflow
      # still does its other job — build, verify, GitHub release — on a fork or
      # before the secret is set. A missing secret is a configuration state, not
      # a broken build.
      - name: Publish to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ inputs.track || env.DEFAULT_PUBLISH_TRACK }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload"
            exit 0
          fi
          pip install --quiet google-api-python-client google-auth
          # --version-code so a dispatched re-run of an already published tag
          # promotes the existing bundle instead of trying to upload a rebuild
          # of it, which Play rejects as a duplicate versionCode.
          python tools/publish_play.py \
            android/app/build/outputs/bundle/release/app-release.aab \
            --track "$TRACK" --version-code "$VERSION_CODE" --commit

      - name: Delete the keystore
        if: always()
        run: rm -f android/upload-keystore.jks
