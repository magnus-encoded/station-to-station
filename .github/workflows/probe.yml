name: API probe (temporary)

# Temporary instrument for #29/#31: does the setlist.fm API return future-dated
# setlists? Deleted once the answer is on the issue.
on:
  push:
    paths: [ ".github/workflows/probe.yml" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bracket the search horizon
        env:
          KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          MBID=172e1f1a-504d-4488-b053-6344ba63e6d0
          # Nick Cave tour dates in August 2026, from the tour listing: probe each
          # by date to find where search/setlists stops returning them, then
          # confirm each is fetchable by id anyway.
          for d in 01-08-2026 02-08-2026 05-08-2026 08-08-2026 13-08-2026 15-08-2026; do
            code=$(curl -sS -o /tmp/o.json -w "%{http_code}" -G \
              "https://api.setlist.fm/rest/1.0/search/setlists" \
              -H "x-api-key: $KEY" -H "Accept: application/json" \
              --data-urlencode "artistMbid=$MBID" --data-urlencode "date=$d")
            echo "search date=$d -> HTTP $code $(head -c 120 /tmp/o.json | tr -d '\n')"
            sleep 2
          done
          echo "--- direct fetch of the Oya id, again, to confirm it is not a fluke"
          curl -sS -G "https://api.setlist.fm/rest/1.0/setlist/53414fd1" \
            -H "x-api-key: $KEY" -H "Accept: application/json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['id'], d['eventDate'], d['artist']['name'], d['venue']['name'], 'sets=', d['sets'])"
