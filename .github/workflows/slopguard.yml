name: SlopGuard

# Tags only. The analyzers drive a full test-with-coverage run on both platforms —
# far too slow to hang off every push, and "what did we ship" is the question a
# CRAP score actually answers.
#
# Nothing here can fail a release. slopguard-swift and slopguard-kotlin are both
# alpha (v0.1.x, schema still moving), so every step that touches them ends in a
# `|| echo "::warning::"` and the report is treated as absent if it isn't valid
# JSON. A broken analyzer costs a warning annotation, never a red tag.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        # The analyzers below are third-party code run on this runner (#165). Nothing
        # after checkout pushes, so the token is not left in .git/config for them.
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # slopguard-kotlin runs the project's own `./gradlew` to get coverage, so the
      # flag has to be on the build it invokes — but putting it in app/build.gradle.kts
      # would put an AGP API the release build depends on behind an alpha tool's
      # requirements. An init script in ~/.gradle/init.d applies to this runner only:
      # if AGP ever drops `enableUnitTestCoverage`, the slopguard job warns and the
      # release workflow never notices.
      - name: Enable AGP unit-test coverage for this runner
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/slopguard-coverage.gradle <<'EOF'
          allprojects {
              plugins.withId("com.android.application") {
                  android.buildTypes.debug.enableUnitTestCoverage = true
              }
          }
          EOF

      # Pinned to a commit (#165): its build scripts run here, so a later push to the
      # tool's default branch must not become code this repository executes unread.
      # Bump the SHA deliberately, after reading what changed.
      - name: Build slopguard-kotlin
        env:
          SLOPGUARD_KOTLIN_SHA: 40204ef8f382ed02ca5b143a55dfab1671840383
        run: |
          mkdir -p "$RUNNER_TEMP/slopguard-kotlin"
          cd "$RUNNER_TEMP/slopguard-kotlin"
          { git init --quiet \
            && git fetch --quiet --depth 1 https://github.com/JeevanThandi/slopguard-kotlin.git "$SLOPGUARD_KOTLIN_SHA" \
            && git checkout --quiet FETCH_HEAD \
            && ./gradlew --no-daemon :app:installDist; } \
            || echo "::warning::slopguard-kotlin failed to build; skipping the Kotlin CRAP report"

      # No secrets here (#165): the unit tests the analyzer drives need no key, as a
      # fork's pull request build already shows, and the analyzer is third-party code.
      - name: Analyze
        working-directory: android
        run: |
          bin="$RUNNER_TEMP/slopguard-kotlin/app/build/install/slopguard-kotlin/bin/slopguard-kotlin"
          [ -x "$bin" ] || { echo "::warning::no slopguard-kotlin binary; skipping"; exit 0; }
          # AGP writes its native JaCoCo XML under build/reports/coverage, which
          # slopguard-kotlin's report finder already scans.
          "$bin" analyze --path app/src/main/java \
            --coverage-tool jacoco \
            --gradle-test-task testDebugUnitTest \
            --gradle-report-task createDebugUnitTestCoverageReport \
            --json --quiet > "$RUNNER_TEMP/slopguard-kotlin.json" \
            || echo "::warning::slopguard-kotlin analysis failed; see the step log"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slopguard-kotlin-report
          path: ${{ runner.temp }}/slopguard-kotlin.json
          if-no-files-found: ignore

      - name: File review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/slopguard-kotlin.json"
          jq -e '.methods' "$report" >/dev/null 2>&1 \
            || { echo "::warning::no usable slopguard-kotlin report; no issues filed"; exit 0; }
          tools/slopguard_issues.sh "$report" kotlin "$GITHUB_REF_NAME"

  swift:
    runs-on: macos-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        # The analyzers below are third-party code run on this runner (#165). Nothing
        # after checkout pushes, so the token is not left in .git/config for them.
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # The published binary rather than a source build: slopguard-swift pulls in
      # swift-syntax, and compiling that costs more than the analysis it enables.
      #
      # Pinned to one release and its checksum (#165): "latest" would run whatever the
      # tool's owner publishes next. Bump both together, deliberately.
      - name: Install slopguard-swift
        run: |
          gh release download "$SLOPGUARD_SWIFT_TAG" --repo JeevanThandi/SlopGuard-Swift \
            --pattern '*macos-universal.tar.gz' --dir "$RUNNER_TEMP" \
            && echo "$SLOPGUARD_SWIFT_SHA256  $(ls "$RUNNER_TEMP"/*macos-universal.tar.gz)" | shasum -a 256 -c - \
            && tar xzf "$RUNNER_TEMP"/*macos-universal.tar.gz -C "$RUNNER_TEMP" \
            || echo "::warning::could not install slopguard-swift; skipping the Swift CRAP report"
        env:
          GH_TOKEN: ${{ github.token }}
          SLOPGUARD_SWIFT_TAG: v0.1.0
          SLOPGUARD_SWIFT_SHA256: 0a21a11ed4792c1d7cae51f17db068909cee48cadf6e13c093b27a16d0582b08

      - name: Select an available iOS Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Analyze
        working-directory: ios
        run: |
          bin=$(find "$RUNNER_TEMP" -maxdepth 3 -name slopguard-swift -type f -perm +111 | head -1)
          [ -n "$bin" ] || { echo "::warning::no slopguard-swift binary; skipping"; exit 0; }
          "$bin" analyze --path StationToStation \
            --scheme StationToStation \
            --destination "id=${{ steps.sim.outputs.udid }}" \
            --json --quiet > "$RUNNER_TEMP/slopguard-swift.json" \
            || echo "::warning::slopguard-swift analysis failed; see the step log"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slopguard-swift-report
          path: ${{ runner.temp }}/slopguard-swift.json
          if-no-files-found: ignore

      - name: File review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="$RUNNER_TEMP/slopguard-swift.json"
          jq -e '.methods' "$report" >/dev/null 2>&1 \
            || { echo "::warning::no usable slopguard-swift report; no issues filed"; exit 0; }
          tools/slopguard_issues.sh "$report" swift "$GITHUB_REF_NAME"
