# This workflow is named "Python CI" and will appear in the Actions tab of your GitHub repository.
name: Python CI

# This section defines the triggers for the workflow.
on:
  # Run the workflow on every push to the "main" branch.
  push:
    branches: [ "main" ]
  # Also run on any pull request that targets the "main" branch.
  pull_request:
    branches: [ "main" ]

# A workflow is made up of one or more jobs.
jobs:
  # This workflow has a single job called "test".
  test:
    # The job will run on the latest version of Ubuntu provided by GitHub.
    runs-on: ubuntu-latest

    # Steps are the sequence of tasks that will be executed for the job.
    steps:
      # Step 1: Use a pre-made action to check out your repository's code.
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up the specific version of Python you're using.
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Step 3: Install the project's dependencies from the requirements.txt file.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run the test suite using Python's built-in unittest module.
      # The 'discover' command automatically finds tests in your repository.
      - name: Run tests
        run: |
          python -m unittest discover
