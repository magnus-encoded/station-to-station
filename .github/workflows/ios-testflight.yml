name: iOS TestFlight

# Archives a signed Release build and uploads it to TestFlight. Dormant until the
# App Store Connect secrets exist: without them the gate job says so and the upload
# job is skipped, so a tag never fails on a missing Apple account.
#
# Secrets (docs/release/ios-app-store.md):
#   APPLE_TEAM_ID             the Developer Program team id
#   ASC_KEY_ID, ASC_ISSUER_ID App Store Connect API key, role App Manager or above
#   ASC_KEY_P8                the key's .p8 contents
# Signing is automatic: xcodebuild uses the API key to create the certificate and
# profiles itself, so no certificate secret is needed. The App IDs and App Group
# must be registered first.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App Store Connect secrets not set; skipping TestFlight upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          args=""
          [ -n "$SPOTIFY_CLIENT_ID" ] && args="$args SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID"
          [ -n "$SETLISTFM_API_KEY" ] && args="$args SETLISTFM_API_KEY=$SETLISTFM_API_KEY"
          # The run number only goes up, so every upload carries a fresh build number.
          xcodebuild archive \
            -project StationToStation.xcodeproj \
            -scheme StationToStation \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/StationToStation.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $args

      - name: Export and upload
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/StationToStation.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
