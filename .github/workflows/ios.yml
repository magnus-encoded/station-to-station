name: iOS CI

on:
  # No branch filter on push, matching android.yml: the work happens on branches,
  # and there is no local Xcode to build against, so a branch that can't reach CI
  # can't be checked at all.
  push:
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  # A release published by hand builds the iOS side for it. Not load-bearing:
  # android-release.yml creates its release with GITHUB_TOKEN, and GitHub will
  # not start a workflow from an event a workflow token raised — so a *tagged*
  # release never fires this. That path is covered from the other end: the
  # release workflow attaches the last green IPA itself.
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # The attach step writes a release asset. The default token is read-only on
    # repos that have tightened it, and the failure lands after the build is paid for.
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build credential overrides
        id: creds
        env:
          # Optional repo secrets; when set, the app ships with one-tap
          # "Log in with Spotify" and a bundled setlist.fm API key. Left unset,
          # the built-in default client ID (from project.yml) still applies.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          args=""
          [ -n "$SPOTIFY_CLIENT_ID" ] && args="$args SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID"
          [ -n "$SETLISTFM_API_KEY" ] && args="$args SETLISTFM_API_KEY=$SETLISTFM_API_KEY"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Select an available iOS Simulator
        id: sim
        run: |
          # Runner images change which iPhone models ship; pick the first available.
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project StationToStation.xcodeproj \
            -scheme StationToStation \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            ${{ steps.creds.outputs.args }}

      # The Timeline is pure geometry and the only way to check it has been to
      # sideload and photograph the screen. StationSnapshotTests renders the real
      # rows to a PNG; this carries it out of the runner so the Spine can be
      # reviewed from a branch. Instrumentation, never a gate: `always()` and
      # `if-no-files-found: ignore` so a skipped render can't fail the build.
      - name: Upload timeline snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timeline-snapshot
          path: ios/snapshot-out/timeline.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Build device app (unsigned)
        working-directory: ios
        run: |
          # Build for real iPhone hardware (arm64), unsigned — a sideload tool
          # re-signs it with the user's Apple ID at install time.
          xcodebuild build \
            -project StationToStation.xcodeproj \
            -scheme StationToStation \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ${{ steps.creds.outputs.args }}

      - name: Package .ipa
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphoneos/StationToStation.app
          rm -rf Payload StationToStation.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qr StationToStation.ipa Payload

      # 14 rather than the 7 the other CI artifacts get: android-release.yml pulls
      # this artifact from the newest green run when a tag is cut, so the retention
      # window has to outlast a quiet spell on main or a release ships without an
      # IPA. That step is continue-on-error, so the failure is soft either way.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: StationToStation-ipa
          path: ios/StationToStation.ipa
          retention-days: 14

      # The same file, put where someone without a GitHub account can reach it.
      # A workflow artifact needs a login to download and is pruned on a retention
      # window, so "the iOS build is on the repo" was only true for signed-in
      # visitors who knew about the Actions tab.
      #
      # It rides the newest release rather than one of its own: the tag is the
      # Android publish, and cutting a parallel iOS tag for a build nobody can
      # install without re-signing it themselves would be ceremony. The name says
      # debug because that is exactly what it is — an unsigned Debug build for
      # arm64, to be signed with the installer's own Apple ID.
      #
      # Fixed filename, --clobber: one stable URL that always holds the newest
      # iOS build, replaced in place rather than accumulating one asset per push.
      # It therefore may be *ahead* of the tag it hangs on, which is the trade
      # for having a link that does not rot.
      - name: Attach the .ipa to the newest release
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # A release event names its own tag; a push to main takes whatever is
          # newest. Without the release trigger, cutting a tag would leave the
          # top release holding an APK and no IPA until the next iOS commit —
          # which is the exact gap this step exists to close.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG:-$(gh release view --json tagName -q .tagName)}"
          if [ -z "$tag" ]; then
            echo "no release to attach to — skipping"
            exit 0
          fi
          cp ios/StationToStation.ipa StationToStation-debug.ipa
          gh release upload "$tag" StationToStation-debug.ipa --clobber
          echo "attached to $tag"
