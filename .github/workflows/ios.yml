name: iOS CI

on:
  push:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "ios/**", ".github/workflows/ios.yml" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build credential overrides
        id: creds
        env:
          # Optional repo secrets; when set, the app ships with one-tap
          # "Log in with Spotify" and a bundled setlist.fm API key. Left unset,
          # the built-in default client ID (from project.yml) still applies.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: |
          args=""
          [ -n "$SPOTIFY_CLIENT_ID" ] && args="$args SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID"
          [ -n "$SETLISTFM_API_KEY" ] && args="$args SETLISTFM_API_KEY=$SETLISTFM_API_KEY"
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Select an available iOS Simulator
        id: sim
        run: |
          # Runner images change which iPhone models ship; pick the first available.
          udid=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project SetlistToSpotify.xcodeproj \
            -scheme SetlistToSpotify \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            ${{ steps.creds.outputs.args }}

      - name: Build device app (unsigned)
        working-directory: ios
        run: |
          # Build for real iPhone hardware (arm64), unsigned — a sideload tool
          # re-signs it with the user's Apple ID at install time.
          xcodebuild build \
            -project SetlistToSpotify.xcodeproj \
            -scheme SetlistToSpotify \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ${{ steps.creds.outputs.args }}

      - name: Package .ipa
        working-directory: ios
        run: |
          app=build/Build/Products/Debug-iphoneos/SetlistToSpotify.app
          rm -rf Payload SetlistToSpotify.ipa
          mkdir Payload
          cp -R "$app" Payload/
          zip -qr SetlistToSpotify.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: SetlistToSpotify-ipa
          path: ios/SetlistToSpotify.ipa
