org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 turns on two independent flags by default (built-in Kotlin support and
# the new DSL), and either one alone rejects the explicit org.jetbrains.kotlin.android
# plugin still applied in app/build.gradle.kts — with two different errors. Both
# must be off together to keep the classic kotlin-android plugin path working
# without a DSL migration; see https://kotl.in/gradle/agp-built-in-kotlin and
# https://kotl.in/gradle/agp-new-dsl.
android.builtInKotlin=false
android.newDsl=false

# AGP 8.7 was tested against compileSdk 35, so compiling against 36 (required by
# Play from Aug 2026) prints an "untested" warning on every build. The build is
# fine; this silences the noise. Drop the line if AGP is ever bumped past 8.9.
android.suppressUnsupportedCompileSdk=36

# versionName is the human half — what a tester reads in the Play listing — and
# moves on its own schedule.
#
# appVersionCode is now only the fallback for local and debug builds. A release
# bundle takes its code from the commit count, passed in as VERSION_CODE by
# android-release.yml; see the comment in app/build.gradle.kts. Both numbers are
# still recoverable from git, which was always the point of keeping them here.
appVersionCode=1
appVersionName=1.2
