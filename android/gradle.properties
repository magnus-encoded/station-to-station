org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 8.7 was tested against compileSdk 35, so compiling against 36 (required by
# Play from Aug 2026) prints an "untested" warning on every build. The build is
# fine; this silences the noise. Drop the line if AGP is ever bumped past 8.9.
android.suppressUnsupportedCompileSdk=36

# versionName is the human half — what a tester reads in the Play listing — and
# moves on its own schedule.
#
# appVersionCode is now only the fallback for local and debug builds. A release
# bundle takes its code from the commit count, passed in as VERSION_CODE by
# android-release.yml; see the comment in app/build.gradle.kts. Both numbers are
# still recoverable from git, which was always the point of keeping them here.
appVersionCode=1
appVersionName=1.2
