org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# What shipped, in one place. Play rejects any upload whose versionCode does not
# exceed the last one it accepted, so this is the number to bump — in a commit,
# so the release that went out is recoverable from git rather than from whoever
# remembers. versionName is the human half and moves on its own schedule.
appVersionCode=1
appVersionName=1.1
