<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PROTOTYPE — gig landscape (#268)</title>
<!--
  THROWAWAY PROTOTYPE — #268 landscape gig view. Not production, not Compose.
  Question: does a flyover down the night's spine feel like anything?
  Four variants, ?variant=A..D, floating bar bottom-centre, ← → to cycle.
  A/B/C are 3D flyovers (CSS 3D ≈ Modifier.graphicsLayer). D is the two-column
  setlist, which answers a different question and is here because it was owed.
  Fake media (gradients, mixed aspects). Real setlist. No persistence, no wiring.
-->
<style>
  :root {
    --ground: #0e0c11; --ink: #e8e6ea; --muted: #8b8794; --faint: #55515e;
    --amber: #d9a441; --slate: #7d8fa9; --line: #2a2732;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--ground); }
  body {
    font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; }

  /* ---- floating switcher (deliberately not part of the design) ---- */
  #bar {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px; z-index: 999;
    background: #fff; color: #111; border-radius: 999px;
    padding: 6px 8px; box-shadow: 0 3px 14px #000a; font-size: 12px;
  }
  #bar button {
    border: 0; background: #eee; border-radius: 999px; width: 26px; height: 26px;
    font-size: 14px; cursor: pointer;
  }
  #bar b { font-weight: 600; min-width: 168px; text-align: center; }
  #hint {
    position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    color: var(--faint); font-size: 11px; z-index: 999; letter-spacing: .3px;
  }

  /* ---- shared 3D scaffolding ---- */
  .scene { position: absolute; inset: 0; perspective: 900px; perspective-origin: 50% 46%; }
  .world { position: absolute; inset: 0; transform-style: preserve-3d; }
  .node { position: absolute; left: 50%; top: 46%; transform-style: preserve-3d; }

  .photo { border-radius: 6px; background-size: cover; box-shadow: 0 6px 24px #000a; }
  .photo.mine  { outline: 1px solid var(--amber); outline-offset: -1px; }
  .photo.their { outline: 1px solid var(--slate); outline-offset: -1px; }
  .who { position: absolute; bottom: 3px; left: 5px; font-size: 9px; color: #fffc; text-shadow: 0 1px 2px #000; }

  /* ---- the wall you reach: what was said about the night ---- */
  .wall {
    width: 560px; margin-left: -280px; padding: 22px 26px;
    background: #14111b; border: 1px solid var(--line); border-radius: 10px;
    /* Anchored by its foot, so it stands on the floor whatever its height —
       an essay-length note grows it upward instead of down through the lines. */
    transform: translateY(-100%);
  }
  .wall h2 { font: 400 15px/1 Georgia, serif; color: var(--muted); margin-bottom: 14px; letter-spacing: .3px; }
  /* The cover: the night's identity, and the thing you look at while the first
     stretch of the night is still being prepared behind it. */
  .wall.cover { text-align: left; padding: 26px; }
  .wall.cover h1 { font: 400 30px/1.1 Georgia, serif; color: var(--ink); margin-bottom: 8px; }
  .wall.cover .where { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .wall.cover .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .wall.cover .chip {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .wall.cover .go { font-size: 12px; color: var(--faint); letter-spacing: .3px; }
  .wall .note {
    padding: 9px 0; border-top: 1px solid var(--line);
    display: flex; align-items: flex-start; gap: 14px;
  }
  .wall .note:first-of-type { border-top: 0; }
  .wall .note .body { flex: 1; min-width: 0; }
  .wall .note .by { font-size: 10px; color: var(--faint); display: block; margin-bottom: 3px; }
  .wall .note.mine { border-left: 2px solid var(--amber); padding-left: 10px; }
  .wall .note.theirs { border-left: 2px solid var(--slate); padding-left: 10px; }
  .wall .note p { font-size: 13px; color: var(--ink); }
  /* The verdict belongs to the note, so it sits on the note's own right edge. */
  .wall .note .v { flex: 0 0 auto; font-size: 15px; line-height: 1.2; opacity: .95; }
  .wall .legend {
    display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
    margin-bottom: 16px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--faint);
  }
  .wall .legend .them { text-align: right; }
  .wall .legend b { font-weight: 500; }
  .wall .legend i { font-style: normal; color: var(--line); }

  .song { color: var(--ink); font-size: 14px; white-space: nowrap; }
  .song .n {
    display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 8px;
    border: 1px solid var(--faint); border-radius: 50%; font-size: 10px; color: var(--muted);
  }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); position: absolute; left: 50%; top: 46%; }
  .photo.sel { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---- see-through twin sticks (variant E) ---- */
  .stick {
    position: fixed; bottom: 30px; width: 108px; height: 108px; border-radius: 50%;
    border: 1px solid #ffffff2e; background: #ffffff0d; z-index: 500; touch-action: none;
  }
  .stick.l { left: 26px; } .stick.r { right: 26px; }
  .stick .knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: #ffffff30; border: 1px solid #ffffff40;
  }
  .stick .cap {
    position: absolute; bottom: -16px; width: 100%; text-align: center;
    font-size: 9px; color: var(--faint); letter-spacing: .4px;
  }
  /* ---- zoom ---- */
  #zoom {
    position: fixed; inset: 0; z-index: 800; display: none; background: #000c;
    align-items: center; justify-content: center;
  }
  #zoom.on { display: flex; }
  #zoom .img { width: min(86vw, 86vh * .72); height: 86vh; border-radius: 8px; background-size: cover; }

  /* ---- D: two-column setlist (flat) ---- */
  #d { position: absolute; inset: 0; padding: 26px 30px; }
  #d h1 { font: 400 20px/1 Georgia, serif; color: var(--ink); margin-bottom: 3px; }
  #d .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  #d .cols { column-count: 2; column-gap: 46px; }
  #d .row { display: flex; align-items: baseline; gap: 10px; padding: 7px 0; break-inside: avoid; }
  #d .row .n {
    flex: 0 0 auto; display: inline-grid; place-items: center; width: 22px; height: 22px;
    border: 1px solid var(--faint); border-radius: 50%; font-size: 10px; color: var(--muted);
  }
  #d .row.woven .n { border-color: var(--amber); }
  #d .row.mineonly .n { border: 0; }
  #d .row.mineonly .n::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--slate); }
  #d .row .t { color: var(--ink); font-size: 15px; }
  #d .row .cover { color: var(--faint); font-size: 11px; display: block; }
</style>

<div id="stage"></div>
<div id="zoom"><div class="img"></div></div>
<div id="hint"></div>
<div id="bar">
  <button id="prev">‹</button><b id="label"></b><button id="next">›</button>
</div>

<script>
// ---------------------------------------------------------------- fake data
const SONGS = ["Get Ready for Love","From Her to Eternity","Train Long-Suffering","Wild God",
  "O Children","Tupelo","Carnage","Joy","Rings of Saturn","The Mercy Seat","Henry Lee","Red Right Hand"];

// capturedAt in arbitrary units across the night, with a deliberate cluster near
// the end (the encore everyone photographs) so density is visible.
const rand = (s => () => (s = s * 16807 % 2147483647) / 2147483647)(7);
const MEDIA = (() => {
  const t = [];
  for (let i = 0; i < 14; i++) t.push(i * 6 + rand() * 4);        // spread through the night
  for (let i = 0; i < 8; i++) t.push(74 + rand() * 5);            // the cluster
  t.sort((a, b) => a - b);
  return t.map((at, i) => {
    const portrait = rand() > 0.42;
    const hue = 200 + rand() * 160;   // stage lighting: blues through to red
    return {
      at, mine: rand() > 0.45, who: (rand() * 3) | 0,
      w: portrait ? 88 : 148, h: portrait ? 148 : 88,
      bg: `linear-gradient(${(rand()*360)|0}deg, hsl(${hue} 55% 42%), hsl(${(hue+50)%360} 60% 14%))`,
    };
  });
})();
const SPAN = MEDIA[MEDIA.length - 1].at;
const DEPTH = 260;               // z-units between song markers
const TOTAL = SONGS.length * DEPTH;

// MAX DENSITY. Capture spacing alone piles the encore cluster into one depth,
// where the photos stack and only the nearest can be picked. No two photos on
// the SAME flank may sit closer than this; opposite flanks never occlude each
// other, so the limit is per side. Dense moments therefore stretch — a burst
// becomes a longer stretch of travel instead of a heap.
const MIN_GAP = 150;
(() => {
  const lastZ = { mine: -1e9, their: -1e9 };
  MEDIA.forEach(m => {
    const raw = (m.at / SPAN) * (TOTAL - DEPTH) + DEPTH * 0.5;
    const side = m.mine ? "mine" : "their";
    m.z = Math.max(raw, lastZ[side] + MIN_GAP);
    lastZ[side] = m.z;
  });
})();
// Where the night's content actually ends, once bursts have been spread out.
const CONTENT_END = Math.max(TOTAL - DEPTH, ...MEDIA.map(m => m.z));

// Contacts who were also at this gig. One floor line each, under the right
// flank — the side their media is on.
// A colour per contact, for this gig. Deliberately not amber — that is yours
// and means private. Distinct enough to tell three apart in the dark.
const FRIENDS = [
  { name: "Sindre", color: "#7d8fa9" },
  { name: "Ada", color: "#6fae8f" },
  { name: "Johan", color: "#b07fc0" },
];
const friendOf = i => FRIENDS[i % FRIENDS.length];
// Verdicts are the app's own glyphs (verdictGlyph): 👎 / 👍 / 👍👍.
// One note is deliberately long — the wall has to survive somebody writing an
// essay about the encore, and that is the case that decides its height.
const NOTES = [
  { mine: true, by: "you · private", verdict: "👍👍",
    text: "Stood too far left. Wild God was the one." },
  { mine: true, by: "you · shared", verdict: "👍👍",
    text: "Third time seeing this and the best." },
  { who: 1, verdict: "👍",
    text: "Mercy Seat went on forever and I did not mind. I've been trying to work out " +
      "why that song does what it does live and I think it's that the band never lets " +
      "the tension resolve — every time you think the verse is going to break it comes " +
      "back round again, and by the eighth or ninth pass the whole room has given up " +
      "waiting for it and just goes with it. Ellis was barely playing by the end, just " +
      "standing there letting it happen. Best twelve minutes of the night by some way." },
  { who: 0, verdict: "👎", text: "Sound was rough at the back." },
];
// The wall must stand clear of the night by more than the cull distance (830),
// or you reach it while the last photos are still passing you — and the encore
// cluster lands exactly there. Content ends ~TOTAL-130; this leaves ~1500.
const WALL_Z = CONTENT_END + 1220;
// The cover stands in front of the night. You start looking at it, and it
// occludes everything behind while the first stretch is still being drawn.
const COVER_Z = -420;
// How far short of the wall you stop. Billboard distance: close enough that it
// dominates the frame and the notes are read, not squinted at. Small numbers
// approach the screen plane, where the wall is at its authored size.
const WALL_STOP = 110;
const START = COVER_Z - WALL_STOP;   // you begin at billboard distance from it
const FLOOR_Y = 132;

// ------------------------------------------------------------- travel state
let travel = START, vel = 0, dragging = false, lastY = 0, lastT = 0, moved = 0;
let stickVel = 0;                       // travel from the left stick (variant E)
let selIndex = -1, selSide = null;      // current selection; side = "mine" | "their"
const stage = document.getElementById("stage");

function onDown(e) {
  if (e.target.closest(".stick")) return;
  dragging = true; vel = 0; moved = 0;
  lastY = e.clientY; lastT = performance.now();
  stage.setPointerCapture(e.pointerId);
}
function onMove(e) {
  if (!dragging) return;
  const now = performance.now(), dy = e.clientY - lastY;
  moved += Math.abs(dy);
  if (built && built.controls === "drag") {
    // Drag UP advances into the night, so travel grows as you go deeper.
    travel -= dy * 2.2;
    if (now > lastT) vel = (-dy * 2.2) / (now - lastT) * 16;
  }
  lastY = e.clientY; lastT = now;
}
function onUp(e) {
  if (!dragging) return;
  dragging = false;
  // A tap is a press that didn't travel. In E the sticks are excluded above,
  // which is exactly the collision "tap anywhere" has with spawn-anywhere sticks.
  if (moved >= 8 || !built || built.select === null) return;
  // F: which half you tap IS the flank. The one bit of ambiguity travel can't
  // resolve is carried by where your thumb already was — no control needed.
  if (built.select === "focal") selIndex = focalPick(e.clientX < innerWidth / 2 ? "mine" : "their");
  openZoom();
}
stage.addEventListener("pointerdown", onDown);
stage.addEventListener("pointermove", onMove);
stage.addEventListener("pointerup", onUp);
stage.addEventListener("pointercancel", onUp);

// ---------------------------------------------------------------- selection
// The candidate is whatever sits nearest the focal plane on the chosen flank.
// Net translateZ of the "you are here" plane. Positive = past the screen plane
// and toward the camera, so the focal photo is ~1.5x its authored size.
const FOCUS = 300;
// perspective is 900px: an element blows up to infinity as net z reaches it.
// Fade out over the last stretch and cull just short of the singularity.
const FADE_FROM = 480, CULL = 830;
function focalPick(side) {
  let best = -1, bestD = 1e9;
  MEDIA.forEach((m, i) => {
    if (side && (m.mine ? "mine" : "their") !== side) return;
    const d = Math.abs((travel - mediaZ(m)) - FOCUS);
    if (d < bestD) { bestD = d; best = i; }
  });
  return best;
}
function openZoom() {
  const m = MEDIA[selIndex];
  if (!m) return;
  const z = document.getElementById("zoom");
  z.querySelector(".img").style.background = m.bg;
  z.querySelector(".img").style.aspectRatio = `${m.w} / ${m.h}`;
  z.classList.add("on");
}
document.getElementById("zoom").addEventListener("pointerup", () =>
  document.getElementById("zoom").classList.remove("on"));

function tick() {
  if (!dragging) { travel += vel; vel *= 0.94; if (Math.abs(vel) < 0.05) vel = 0; }  // inertia
  travel -= stickVel;
  // You start at the cover, travel through the night, and stop at the wall.
  const min = START, max = WALL_Z - WALL_STOP;
  if (travel < min) { travel = min; vel = 0; }
  if (travel > max) { travel = max; vel = 0; }
  render();
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------ helpers
function el(tag, cls, css, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (css) Object.assign(n.style, css);
  if (html != null) n.innerHTML = html;
  return n;
}
// z of a photo: capture order mapped across the night, deliberately OFF the
// song gridlines so adjacency can never be read as correspondence.
const mediaZ = m => m.z;
const songZ = i => i * DEPTH;
const depthFade = z => { const d = z + travel; return d > 60 ? 0 : Math.max(0, 1 + (d + 900) / 900 * 0 + Math.min(0, (d + 1500) / 700)); };

// =============================================================== VARIANT A
// Flanked spine. Diagrammatic: the dotted line recedes, numbered song markers
// evenly spaced on it, photos flanking at capture spacing. Side = whose camera.
function buildFlanked(controls, name) {
  const scene = el("div", "scene"), world = el("div", "world"), tiles = [], nodes = [];
  for (let i = 0; i < TOTAL / 30 + 40; i++) {
    const z = i * 30;
    nodes.push({ el: world.appendChild(el("div", "dot", { transform: `translate3d(-50%,0,${-z}px)` })), z });
  }
  SONGS.forEach((s, i) => {
    const z = songZ(i);
    nodes.push({ el: world.appendChild(el("div", "node song", {
      transform: `translate3d(-50%,-46px,${-z}px)`,
    }, `<span class="n">${i + 1}</span>${s}`)), z });
  });
  MEDIA.forEach(m => {
    const z = mediaZ(m), x = m.mine ? -1 : 1;
    const f = friendOf(m.who);
    const tile = el("div", "photo " + (m.mine ? "mine" : "their"),
      { width: m.w + "px", height: m.h + "px", background: m.bg,
        outline: m.mine ? "" : "1px solid " + f.color },
      `<span class="who">${m.mine ? "you" : f.name}</span>`);
    const node = world.appendChild(el("div", "node", {
      transform: `translate3d(${x * 150 - m.w / 2}px,${-m.h / 2}px,${-z}px) rotateY(${-x * 26}deg)`,
    }));
    node.appendChild(tile);
    nodes.push({ el: node, z });
    tiles.push(tile);
  });
  // Floor lines, dashed like the spine so they read as the same family. Amber
  // under the left flank — that side is yours. One line per contact who was
  // also here, under the right, where their media sits.
  const dashes = (x, color, w) => {
    // The runs pass under the wall and carry on into the dark. Stopping them
    // at the wall read as an ending — the night doesn't end at your feet, and
    // there is already a terminus in the frame.
    for (let z = COVER_Z; z < WALL_Z + 1400; z += 60) {
      nodes.push({ el: world.appendChild(el("div", "node", {
        transform: `translate3d(${x}px,${FLOOR_Y}px,${-z}px) rotateX(90deg)`,
        width: w + "px", height: "26px", background: color, borderRadius: "2px",
      })), z, floor: true });
    }
  };
  dashes(-150, "var(--amber)", 3);
  FRIENDS.forEach((f, i) => dashes(96 + i * 46, f.color, 2));

  // Culled like anything else once you have gone through it — unlike the end
  // wall, which you never pass.
  const coverNode = world.appendChild(el("div", "node", {
    transform: `translate3d(0,${FLOOR_Y - 26}px,${-COVER_Z}px)`,
  }));
  nodes.push({ el: coverNode, z: COVER_Z });
  coverNode.appendChild(el("div", "wall cover", null,
      `<h1>Nick Cave &amp; The Bad Seeds</h1>` +
      `<div class="where">Oslo Spektrum · 14 August 2026</div>` +
      `<div class="chips"><span class="chip">12 songs</span>` +
      `<span class="chip">Wild God Tour</span>` +
      `<span class="chip">checked in</span></div>` +
      // The legend, laid out as the floor is: you on the left in amber, the
      // others on the right in the same left-to-right order as their lines, so
      // the cover reads as a key to the ground you are about to walk over.
      `<div class="legend">` +
      `<span class="me"><b style="color:var(--amber)">you</b></span>` +
      `<span class="them">` +
      FRIENDS.map(f => `<b style="color:${f.color}">${f.name}</b>`).join("<i> · </i>") +
      `</span></div>` +
      `<div class="go">drag up to walk the night</div>`));

  // The end of the night: what was said about it. You reach it, you don't pass
  // through it — travel stops short so the wall stands and can be read.
  world.appendChild(el("div", "node", { transform: `translate3d(0,${FLOOR_Y - 26}px,${-WALL_Z}px)` }))
    .appendChild(el("div", "wall", null,
      `<h2>what was said about this night</h2>` +
      NOTES.map(n => {
        const f = n.mine ? null : FRIENDS[n.who];
        return `<div class="note ${n.mine ? "mine" : "theirs"}"` +
          (f ? ` style="border-left-color:${f.color}"` : "") +
          `><div class="body"><span class="by">${n.mine ? n.by : f.name}</span>` +
          `<p>${n.text}</p></div><div class="v">${n.verdict}</div></div>`;
      }).join("") +
      ""));

  scene.appendChild(world);
  const out = { scene, world, tiles, nodes, controls, name };
  if (controls === "sticks") out.sticks = buildSticks(scene);
  return out;
}

// Fixed footprints, not spawn-anywhere: that is what leaves "tap anywhere else"
// a gesture the sticks haven't already eaten.
function buildSticks(scene) {
  const mk = (side, cap) => {
    const s = el("div", "stick " + side, null, `<div class="knob"></div><div class="cap">${cap}</div>`);
    const knob = s.querySelector(".knob");
    let on = false, cx = 0, cy = 0;
    s.addEventListener("pointerdown", e => {
      on = true; const r = s.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      s.setPointerCapture(e.pointerId); e.stopPropagation();
    });
    s.addEventListener("pointermove", e => {
      if (!on) return;
      const dx = Math.max(-34, Math.min(34, e.clientX - cx));
      const dy = Math.max(-34, Math.min(34, e.clientY - cy));
      knob.style.transform = `translate(${dx}px,${dy}px)`;
      s.dispatchEvent(new CustomEvent("stick", { detail: { x: dx / 34, y: dy / 34 } }));
    });
    const off = e => {
      if (!on) return;
      on = false; knob.style.transform = "";
      s.dispatchEvent(new CustomEvent("stick", { detail: { x: 0, y: 0 } }));
    };
    s.addEventListener("pointerup", off);
    s.addEventListener("pointercancel", off);
    scene.parentNode.appendChild(s);
    return s;
  };
  const left = mk("l", "travel"), right = mk("r", "choose");
  left.addEventListener("stick", e => { stickVel = e.detail.y * 26; });
  // Discrete on the vertical: step on crossing the deadzone, so a continuous
  // stick can't overshoot a discrete list.
  let armed = true;
  right.addEventListener("stick", e => {
    const { x, y } = e.detail;
    if (Math.abs(x) > 0.4) selSide = x < 0 ? "mine" : "their";
    if (Math.abs(y) < 0.3) armed = true;
    else if (armed) {
      armed = false;
      const pool = MEDIA.map((m, i) => i).filter(i =>
        !selSide || (MEDIA[i].mine ? "mine" : "their") === selSide);
      const at = pool.indexOf(selIndex);
      selIndex = pool[Math.max(0, Math.min(pool.length - 1, at + (y < 0 ? 1 : -1)))] ?? selIndex;
      const target = mediaZ(MEDIA[selIndex]);      // travel to whatever you picked
      travel = target + FOCUS;
    }
  });
  return { left, right };
}

const variantA = () => Object.assign(buildFlanked("drag", "Flanked spine — drag"), { select: null });
const variantE = () => Object.assign(buildFlanked("sticks", "Twin sticks"), { select: "stick" });
const variantF = () => Object.assign(buildFlanked("drag", "No controls — centre selects"), { select: "focal" });

// =============================================================== VARIANT B
// Corridor. You fly BETWEEN two walls of photos; the setlist is the floor.
// Photos are large because you pass close to them.
function variantB() {
  const scene = el("div", "scene"), world = el("div", "world");
  scene.style.perspectiveOrigin = "50% 40%";
  SONGS.forEach((s, i) => {
    const z = songZ(i);
    world.appendChild(el("div", "node song", {
      transform: `translate3d(-50%,120px,${-z}px) rotateX(72deg)`,
      color: "var(--muted)",
    }, `<span class="n">${i + 1}</span>${s}`));
  });
  MEDIA.forEach(m => {
    const z = mediaZ(m), x = m.mine ? -1 : 1;
    const h = Math.round(m.h * 1.7), w = Math.round(m.w * 1.7);
    world.appendChild(el("div", "node", {
      transform: `translate3d(${x * 230}px,${-h / 2}px,${-z}px) rotateY(${x * 90}deg)`,
    })).appendChild(el("div", "photo " + (m.mine ? "mine" : "their"),
      { width: w + "px", height: h + "px", background: m.bg, transform: "translateX(-50%)" },
      `<span class="who">${m.mine ? "you" : "someone else"}</span>`));
  });
  scene.appendChild(world);
  return { scene, world, name: "Corridor walls" };
}

// =============================================================== VARIANT C
// Depth stack. Everything faces you and the whole night is visible at once in
// Z — glanceable rather than travelled. Songs are ticks running into depth.
function variantC() {
  const scene = el("div", "scene"), world = el("div", "world");
  scene.style.perspective = "1400px";
  scene.style.perspectiveOrigin = "50% 50%";
  SONGS.forEach((s, i) => {
    const z = songZ(i) * 0.8;
    world.appendChild(el("div", "node song", {
      transform: `translate3d(-460px,-40px,${-z}px)`, fontSize: "12px", color: "var(--faint)",
    }, `<span class="n">${i + 1}</span>${s}`));
  });
  MEDIA.forEach((m, i) => {
    const z = mediaZ(m) * 0.8;
    const x = (i % 2 ? 1 : -1) * (60 + (i * 37) % 130);
    const y = ((i * 53) % 120) - 60;
    world.appendChild(el("div", "node", {
      transform: `translate3d(${x - m.w / 2}px,${y}px,${-z}px)`,
    })).appendChild(el("div", "photo " + (m.mine ? "mine" : "their"),
      { width: m.w + "px", height: m.h + "px", background: m.bg }, ""));
  });
  scene.appendChild(world);
  return { scene, world, name: "Depth stack" };
}

// =============================================================== VARIANT D
// Two columns, flat. Not a flyover — the question from Q3, kept honest:
// ragged rows, a cover annotation, a mine-only dot, so column balance is
// tested against the rows this screen actually has.
function variantD() {
  const root = el("div", null, null, "");
  root.id = "d";
  const rows = SONGS.map((s, i) => {
    const cover = i === 6 ? `<span class="cover">Nick Cave &amp; Warren Ellis cover</span>` : "";
    return `<div class="row woven"><span class="n">${i + 1}</span><span class="t">${s}${cover}</span></div>`;
  });
  rows.splice(4, 0, `<div class="row mineonly"><span class="n"></span><span class="t">something they played that isn't published</span></div>`);
  root.innerHTML =
    `<h1>Nick Cave &amp; The Bad Seeds</h1>` +
    `<div class="sub">Oslo Spektrum · 14 August 2026</div>` +
    `<div class="cols">${rows.join("")}</div>`;
  return { flat: root, name: "Two-column setlist" };
}

// ---------------------------------------------------------------- switcher
const VARIANTS = { A: variantA, E: variantE, F: variantF, B: variantB, C: variantC, D: variantD };
const KEYS = Object.keys(VARIANTS);
let current = null, built = null;

function mount(key) {
  current = key;
  travel = START; vel = 0; stickVel = 0; selIndex = -1; selSide = null;
  document.querySelectorAll(".stick").forEach(s => s.remove());
  document.getElementById("zoom").classList.remove("on");
  stage.innerHTML = "";
  built = VARIANTS[key]();
  stage.appendChild(built.flat || built.scene);
  document.getElementById("label").textContent = `${key} — ${built.name}`;
  document.getElementById("hint").textContent =
    built.flat ? "" :
    built.controls === "sticks" ? "left stick travels · right stick chooses · tap anywhere else to zoom" :
    built.select === "focal" ? "drag up to travel · tap left for yours, right for theirs · End / top-left corner jumps to the wall" :
    "drag up to travel the night";
  const url = new URL(location); url.searchParams.set("variant", key); history.replaceState(null, "", url);
}
function render() {
  if (!built || !built.world) return;
  built.world.style.transform = `translateZ(${travel}px)`;
  // Anything you have already passed must vanish, or it blows up through the
  // camera and smears across the frame. Only touched when the state flips.
  if (built.nodes) {
    for (const n of built.nodes) {
      const net = travel - n.z;
      const gone = net > CULL;
      if (gone !== n.gone) { n.gone = gone; n.el.style.visibility = gone ? "hidden" : ""; }
      if (gone) continue;
      // Softens the last moment so nothing pops out; you pass through it.
      let o = net < FADE_FROM ? 1 : 1 - (net - FADE_FROM) / (CULL - FADE_FROM);
      // Floor lines come up out of the dark: faint at distance, solid as you
      // reach them, so the far convergence stops competing with what's ahead.
      if (n.floor) o *= Math.max(0.1, Math.min(1, (net + 1500) / 1000));
      if (n.o === undefined || Math.abs(o - n.o) > 0.04) { n.o = o; n.el.style.opacity = o; }
    }
  }
  if (built.select === "focal") {
    // Both candidates are lit, faintly: you can see what each half would give
    // you before you commit a thumb to it.
    const l = focalPick("mine"), r = focalPick("their");
    built.tiles.forEach((t, i) => t.classList.toggle("sel", i === l || i === r));
  } else if (built.select && built.tiles) {
    built.tiles.forEach((t, i) => t.classList.toggle("sel", i === selIndex));
  }
}
function cycle(d) { mount(KEYS[(KEYS.indexOf(current) + d + KEYS.length) % KEYS.length]); }

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  // Debug jumps: End goes straight to the wall, Home back to the start.
  // Isolates "can't travel far enough" from "the wall isn't drawing".
  if (e.key === "End") { travel = WALL_Z - WALL_STOP; vel = 0; }
  if (e.key === "Home") { travel = START; vel = 0; }
});
// Double-tap the top-left corner does the same on a touchscreen.
addEventListener("pointerdown", e => {
  if (e.clientX < 70 && e.clientY < 70) { travel = WALL_Z - WALL_STOP; vel = 0; }
}, true);

mount(new URL(location).searchParams.get("variant") || "A");
tick();
</script>
